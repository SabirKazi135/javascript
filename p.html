<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Price Calculator</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: Arial, sans-serif;
        height: 100vh;
        background-color: #181818;
        color: white;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .box {
        text-align: center;
        background-color: #242424;
        width: 600px;
        padding: 20px;
        box-sizing: border-box;
        box-shadow: rgba(0, 0, 0, 0.2) 0px 4px 8px 0px;
        border-radius: 8px;
      }

      h1 {
        font-size: 32px;
        margin: 0px 0px 20px 0px;
      }

      input {
        font-size: 13.333px;
        text-decoration: none solid rgb(234, 234, 234);
        border: 1px solid #ccc;
        padding: 10px;
        overflow: clip;
        cursor: text;
        border-radius: 4px;
        width: 448px;
        background-color: #333;
        margin: 10px 0px;
        color: #eaeaea;
      }

      button {
        background-color: #4caf50;
        margin: 10px 0px;
        padding: 10px;
        width: 448px;
        border-radius: 4px;
        border: none;
        cursor: pointer;
        color: #fff;
      }

      button:hover {
        background-color: #45a049;
      }

      .list {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px;
        background-color: #333;
        border-radius: 8px;
        margin-bottom: 10px;
      }

      .discounted-price {
        font-weight: 700px;
        color: #4caf50;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <h1>Product Price Calculator</h1>
      <form action="">
        <input type="text" placeholder="Product Name" id="name" /><br />
        <input type="number" placeholder="Product Price" id="price" /><br />
        <input type="number" placeholder="Discount" id="discount" /><br />
        <button id="button">Add Product</button><br />
      </form>
      <div id="list-box"></div>
    </div>

    <script>
      const button = document.getElementById("button");
      const product = document.getElementById("name");
      const price = document.getElementById("price");
      const discount = document.getElementById("discount");
      const listBox = document.getElementById("list-box");
      button.addEventListener("click", (event) => {
        event.preventDefault();

        const finalPrice = price.value - (price.value * discount.value) / 100;

        let list = document.createElement("div");

        let Pproduct = document.createElement("p");
        let Pprice = document.createElement("p");
        let Pdiscount = document.createElement("p");
        let PfinalPrice = document.createElement("p");

        Pproduct.textContent = `${product.value}`;
        Pprice.textContent = `$${parseFloat(price.value).toFixed(2)}`;
        Pdiscount.textContent = `Discount: ${discount.value}%`;
        PfinalPrice.textContent = `$${parseFloat(finalPrice).toFixed(2)}`;

        Pproduct.classList.add("product");
        Pprice.classList.add("price");
        Pdiscount.classList.add("discount");
        PfinalPrice.classList.add("discounted-price");

        list.appendChild(Pproduct);
        list.appendChild(Pprice);
        list.appendChild(Pdiscount);
        list.appendChild(PfinalPrice);

        list.classList.add("list");

        listBox.appendChild(list);
      });
    </script>
  </body>
</html>
